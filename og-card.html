<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #0e1110; color: #f3efe6;
    font-family: Arial, sans-serif;
    overflow: hidden; position: relative;
    display: flex; align-items: center;
  }
  .grid {
    position: absolute; inset: 0; opacity: 0.08;
    background-image:
      linear-gradient(rgba(243,239,230,.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(243,239,230,.4) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .glow {
    position: absolute; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,90,31,0.28), transparent 65%);
    right: -80px; top: -120px; filter: blur(20px);
  }
  .left { padding-left: 72px; position: relative; z-index: 2; }
  .tag {
    display: inline-block; font-size: 16px; letter-spacing: 3px;
    color: #ff5a1f; border: 2px solid rgba(255,90,31,0.45);
    border-radius: 100px; padding: 10px 22px; margin-bottom: 28px; font-weight: 700;
  }
  h1 {
    font-size: 92px; font-weight: 800; line-height: 0.95;
    letter-spacing: -3px; text-transform: uppercase; margin-bottom: 22px;
  }
  h1 span { color: #ff5a1f; }
  .role { font-size: 26px; color: #9aa19a; margin-bottom: 32px; }
  .role b { color: #f3efe6; }
  .site {
    font-size: 22px; color: #0e1110; background: #ff5a1f;
    display: inline-block; padding: 12px 28px; border-radius: 100px; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="left">
    <div class="tag">OPEN TO WORK</div>
    <h1>Jay<br>Kaneriya<span>.</span></h1>
    <div class="role">Senior Full Stack Developer · <b>Laravel · Vue · React</b> · 8+ years</div>
    <div class="site">jaykaneriya.github.io</div>
  </div>
</body>
</html>
