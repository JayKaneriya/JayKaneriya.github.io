<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Jay Kaneriya</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0b0f;
    color: #f2efe9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    font-family: 'JetBrains Mono', monospace;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }
  .blob {
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.3), transparent 65%);
    top: -250px; right: -150px;
    filter: blur(80px);
    pointer-events: none;
  }
  img.avatar { width: 180px; border-radius: 28px; border: 1px solid rgba(242,239,233,0.15); }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: clamp(64px, 14vw, 140px);
    font-weight: 800;
    line-height: 1;
    color: #d4ff4f;
    letter-spacing: -4px;
  }
  p { color: #8a8a93; font-size: 14px; }
  a {
    color: #0b0b0f;
    background: #d4ff4f;
    text-decoration: none;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    padding: 15px 32px;
    border-radius: 100px;
  }
</style>
</head>
<body>
  <div class="blob"></div>
  <img class="avatar" src="/jay-avatar.jpg" alt="Jay Kaneriya character looking confused">
  <h1>404</h1>
  <p>This page doesn't exist — but my portfolio does.</p>
  <a href="/">TAKE ME HOME →</a>
</body>
</html>
